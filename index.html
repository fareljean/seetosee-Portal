<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holiday Paper Preview</title><style>html,body{margin:0;background:#000;color:#fff;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;letter-spacing:.08em}</style></head><body><div id="boot">LOADING HOLIDAY PAPER…</div><script>
(async()=>{
  try{
    const files=['payload/00.txt','payload/01.txt','payload/02.txt','payload/03.txt','payload/04.txt','payload/05.txt','payload/06.txt','payload/07.txt','payload/08.txt'];
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));
    const b64=parts.join('').trim();
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(err){document.getElementById('boot').textContent='Preview load failed: '+err.message;console.error(err)}
})();
</script></body></html>
