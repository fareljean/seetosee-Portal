<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>See to See · Four Seats</title>
<style>
:root{--bg:#050507;--panel:#0e0e13;--line:#2b2b35;--gold:#ebc979;--text:#f4f0e9;--muted:#9995a3;--red:#ff6e63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100dvh}.app{width:min(1100px,100%);margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:var(--gold);font-weight:900;letter-spacing:.2em}.version{color:var(--muted);letter-spacing:.1em}.status,.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px}.status.live{border-color:#756134;color:var(--gold)}.lobby{display:grid;gap:14px}.btn,input{min-height:58px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;letter-spacing:.08em;padding:12px 20px}.btn{cursor:pointer}.primary{background:var(--gold);color:#111}.danger{border-color:var(--red);color:var(--red)}input{width:100%;text-align:center;font-size:1.25rem;letter-spacing:.25em}.hidden{display:none!important}.roomline{text-align:center}.code{font-size:2rem;color:var(--gold);font-weight:900;letter-spacing:.22em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.seat{position:relative;aspect-ratio:1;background:#09090d;border:1px solid var(--line);border-radius:18px;overflow:hidden}.seat video{width:100%;height:100%;object-fit:cover;background:#09090d}.seat.local video{transform:scaleX(-1)}.tag{position:absolute;left:12px;bottom:10px;color:var(--gold);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);letter-spacing:.15em}.seat.has-media .empty{display:none}.hear{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);border-color:var(--gold);color:var(--gold);background:#09090eee}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls .btn{flex:1;min-width:135px}@media(max-width:600px){.app{padding:12px}.grid{gap:7px}.seat{border-radius:13px}.btn{min-height:52px}.code{font-size:1.55rem}}
</style></head><body><main class="app"><div class="top"><div class="brand">SEE TO SEE</div><div class="version">V2 · FOUR SEATS</div></div><div id="status" class="status">Create a four-seat room or join with its key.</div>
<section id="lobby" class="lobby"><button id="create" class="btn primary">CREATE FOUR-SEAT ROOM</button><div class="panel"><input id="roomInput" maxlength="6" placeholder="ROOM KEY"><button id="join" class="btn" style="width:100%;margin-top:10px">JOIN ROOM</button></div></section>
<section id="call" class="hidden"><div class="roomline panel">ROOM <div id="roomCode" class="code">------</div><div id="count">1 of 4 seats</div><div id="links">0 media links</div></div><div id="grid" class="grid"></div><div class="controls"><button id="startAll" class="btn primary">START ALL AUDIO</button><button id="reconnect" class="btn">RECONNECT ALL</button><button id="mute" class="btn">MUTE</button><button id="restart" class="btn">RESTART MIC</button><button id="camera" class="btn">CAM OFF</button><button id="leave" class="btn danger">LEAVE</button></div><button id="copy" class="btn" style="width:100%;margin-top:8px">COPY INVITE</button></section></main>
<script>
(()=>{'use strict';const API=new URL('signal.php',location.href).href;const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
const S={room:null,id:null,seat:null,token:null,after:0,stream:null,peers:new Map(),timer:null,muted:false,cam:false};const $=id=>document.getElementById(id);const status=(m,k='')=>{$('status').textContent=m;$('status').className='status '+k};
async function api(action,o={}){let u=API+'?action='+encodeURIComponent(action);Object.entries(o.query||{}).forEach(([k,v])=>u+='&'+encodeURIComponent(k)+'='+encodeURIComponent(v));const h={};if(S.token)h['X-Booth-Token']=S.token;const init={method:o.body?'POST':'GET',headers:h};if(o.body){h['Content-Type']='application/json';init.body=JSON.stringify(o.body)}const r=await fetch(u,init),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'HTTP '+r.status),{data:d});return d}
async function mic(force=false){let a=S.stream&&S.stream.getAudioTracks()[0];if(force||!a||a.readyState!=='live'||a.muted){const x=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const n=x.getAudioTracks()[0];if(!S.stream)S.stream=new MediaStream();S.stream.getAudioTracks().forEach(t=>{S.stream.removeTrack(t);t.stop()});S.stream.addTrack(n);a=n}a.enabled=!S.muted;for(const p of S.peers.values()){const sender=p.pc.getSenders().find(x=>x.track&&x.track.kind==='audio');if(sender)await sender.replaceTrack(a)}return a}
function seatEl(id,seat,local=false){let e=$('seat-'+id);if(e)return e;e=document.createElement('div');e.id='seat-'+id;e.className='seat'+(local?' local':'');e.innerHTML='<video playsinline autoplay muted></video><div class="empty">SEAT '+seat+'</div><span class="tag">'+(local?'You':'Seat '+seat)+'</span>';$('grid').appendChild(e);if(local&&S.stream){e.querySelector('video').srcObject=S.stream;e.classList.add('has-media')}return e}
function render(people){$('count').textContent=people.length+' of 4 seats';const ids=new Set(people.map(p=>p.id));people.sort((a,b)=>a.seat-b.seat).forEach(p=>seatEl(p.id,p.seat,p.id===S.id));for(let n=1;n<=4;n++){if(!people.some(p=>p.seat===n)){let e=$('empty-'+n);if(!e){e=document.createElement('div');e.id='empty-'+n;e.className='seat';e.innerHTML='<div class="empty">OPEN SEAT '+n+'</div>';$('grid').appendChild(e)}}else $('empty-'+n)?.remove()}for(const [id,p] of S.peers)if(!ids.has(id)){p.pc.close();p.el.remove();S.peers.delete(id)}}
function send(to,type,data){return api('signal',{body:{room:S.room,peer:S.id,to,type,data}})}
function peer(id,seat){if(S.peers.has(id))return S.peers.get(id);const pc=new RTCPeerConnection(ICE),el=seatEl(id,seat),remote=new MediaStream(),video=el.querySelector('video');video.srcObject=remote;const audio=document.createElement('audio');audio.autoplay=true;audio.playsInline=true;audio.srcObject=remote;el.appendChild(audio);S.stream.getTracks().forEach(t=>pc.addTrack(t,S.stream));pc.addTransceiver('video',{direction:'sendrecv'});pc.onicecandidate=e=>e.candidate&&send(id,'ice',{candidate:e.candidate}).catch(()=>{});pc.ontrack=e=>{if(!remote.getTracks().some(t=>t.id===e.track.id))remote.addTrack(e.track);el.classList.add('has-media');if(e.track.kind==='audio')audio.play().catch(()=>{if(el.querySelector('.hear'))return;let b=document.createElement('button');b.className='btn hear';b.textContent='START AUDIO';b.onclick=()=>audio.play().then(()=>b.remove());el.appendChild(b)})};pc.onconnectionstatechange=()=>{const live=[...S.peers.values()].filter(x=>x.pc.connectionState==='connected').length;$('links').textContent=live+' of '+S.peers.size+' media links';if(pc.connectionState==='connected')status('Connected · '+$('count').textContent,'live');if(['failed','disconnected'].includes(pc.connectionState)&&S.seat<seat)setTimeout(()=>offer(id,true),800)};const p={pc,el,remote,audio,seat,making:false,polite:S.seat>seat,pending:[],lastOffer:0};S.peers.set(id,p);return p}
async function offer(id,restart=false){const p=S.peers.get(id);if(!p||p.pc.signalingState!=='stable'||p.making)return;if(Date.now()-p.lastOffer<1800)return;await mic();p.making=true;p.lastOffer=Date.now();try{await p.pc.setLocalDescription(await p.pc.createOffer(restart?{iceRestart:true}:undefined));await send(id,'offer',{sdp:p.pc.localDescription})}finally{p.making=false}}
async function flushIce(p){if(!p.pc.remoteDescription)return;const list=p.pending.splice(0);for(const c of list)await p.pc.addIceCandidate(c).catch(()=>{})}
async function signal(x){if(x.from===S.id||!x.from)return;const p=S.peers.get(x.from);if(!p)return;const pc=p.pc;if(x.type==='offer'){const collision=p.making||pc.signalingState!=='stable';if(collision&&!p.polite)return;if(collision)await pc.setLocalDescription({type:'rollback'});await mic();await pc.setRemoteDescription(x.data.sdp);await flushIce(p);await pc.setLocalDescription(await pc.createAnswer());await send(x.from,'answer',{sdp:pc.localDescription})}else if(x.type==='answer'&&pc.signalingState==='have-local-offer'){await pc.setRemoteDescription(x.data.sdp);await flushIce(p)}else if(x.type==='ice'&&x.data?.candidate){if(pc.remoteDescription)await pc.addIceCandidate(x.data.candidate).catch(()=>{});else p.pending.push(x.data.candidate)}}
async function poll(){try{const d=await api('poll',{query:{room:S.room,peer:S.id,after:S.after}});render(d.participants);for(const person of d.participants){if(person.id!==S.id&&!S.peers.has(person.id)){peer(person.id,person.seat);if(S.seat<person.seat)setTimeout(()=>offer(person.id),300+S.seat*450)}}for(const x of d.signals){try{await signal(x)}catch(e){console.warn('signal',x.type,e)}finally{S.after=Math.max(S.after,x.id)}}const now=Date.now();for(const [id,p] of S.peers)if(S.seat<p.seat&&!['connected','connecting'].includes(p.pc.connectionState)&&now-p.lastOffer>3500)offer(id,p.pc.connectionState==='failed').catch(()=>{})}catch(e){status('Connection check: '+e.message)}}
async function start(d){S.room=d.room;S.id=d.peer;S.seat=d.seat;S.token=d.token;S.after=0;await mic();$('lobby').classList.add('hidden');$('call').classList.remove('hidden');$('roomCode').textContent=S.room;seatEl(S.id,S.seat,true);status('Room open · share the key','live');await poll();S.timer=setInterval(poll,700)}
$('create').onclick=async()=>{try{await start(await api('create',{body:{}}))}catch(e){status('Create failed: '+e.message)}};$('join').onclick=async()=>{try{await start(await api('join',{body:{room:$('roomInput').value.trim().toUpperCase()}}))}catch(e){status(e.data?.full?'Room full':'Join failed: '+e.message)}};
$('startAll').onclick=async()=>{let heard=0;for(const p of S.peers.values())try{await p.audio.play();p.el.querySelector('.hear')?.remove();heard++}catch(e){}status('Audio opened for '+heard+' of '+S.peers.size+' people',heard===S.peers.size?'live':'')};
$('reconnect').onclick=async()=>{status('Reconnecting all seats…');for(const [id,p] of S.peers){p.lastOffer=0;await offer(id,true).catch(()=>{})}setTimeout(poll,500)};
$('mute').onclick=()=>{S.muted=!S.muted;S.stream?.getAudioTracks().forEach(t=>t.enabled=!S.muted);$('mute').textContent=S.muted?'UNMUTE':'MUTE'};$('restart').onclick=async()=>{try{await mic(true);for(const id of S.peers.keys())await offer(id);status('Microphone restarted','live')}catch(e){status('Mic failed: '+e.message)}};
$('camera').onclick=async()=>{for(const p of S.peers.values())try{await p.audio.play();p.el.querySelector('.hear')?.remove()}catch(e){}try{if(!S.cam){const x=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}}),t=x.getVideoTracks()[0];S.stream.getVideoTracks().forEach(v=>{S.stream.removeTrack(v);v.stop()});S.stream.addTrack(t);const v=$('seat-'+S.id).querySelector('video');v.srcObject=S.stream;v.muted=true;$('seat-'+S.id).classList.add('has-media');for(const p of S.peers.values()){const tr=p.pc.getTransceivers().find(q=>q.receiver?.track?.kind==='video');await tr.sender.replaceTrack(t)}S.cam=true;$('camera').textContent='CAM ON';for(const id of S.peers.keys())await offer(id)}else{const t=S.stream.getVideoTracks()[0];for(const p of S.peers.values()){const tr=p.pc.getTransceivers().find(q=>q.receiver?.track?.kind==='video');await tr.sender.replaceTrack(null)}if(t){S.stream.removeTrack(t);t.stop()}S.cam=false;$('camera').textContent='CAM OFF'}}catch(e){status('Camera: '+e.message)}};
$('copy').onclick=()=>navigator.clipboard.writeText(location.href.split('?')[0]+'?room='+S.room).then(()=>status('Invite copied','live'));
$('leave').onclick=()=>{clearInterval(S.timer);api('leave',{body:{room:S.room,peer:S.id}}).catch(()=>{});S.peers.forEach(p=>p.pc.close());S.stream?.getTracks().forEach(t=>t.stop());location.href=location.href.split('?')[0]};
const q=new URLSearchParams(location.search).get('room');if(q){$('roomInput').value=q.toUpperCase();status('Room '+q.toUpperCase()+' · tap Join room')}
})();
</script></body></html>
