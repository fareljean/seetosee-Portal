<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeeTest Rooms → SeeToSee Booth</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07080a; color: #f4f0e9; font-family: Arial, Helvetica, sans-serif; }
    .card { width: min(520px, 92vw); border: 1px solid #2b2b35; border-radius: 18px; padding: 28px; background: #0e0e13; }
    h1 { margin: 0 0 10px; font-size: 1.4rem; }
    p { color: #aeb3bd; line-height: 1.5; }
    a { display: block; margin-top: 12px; padding: 14px 18px; border-radius: 999px; text-align: center; text-decoration: none; font-weight: 800; letter-spacing: .04em; }
    .primary { background: #ebc979; color: #111; }
    .secondary { border: 1px solid #3a3a45; color: #f4f0e9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SeeTest rooms closed</h1>
    <p>Ungated booth embeds were removed. Enter through the SeeToSee Dashboard so a signed booth pass can be minted.</p>
    <a class="primary" href="https://seetosee.org/Seeme/dashboard/#booth">Enter Two-Seat Booth (Dashboard)</a>
    <a class="secondary" href="https://seetosee.org/Seeme/dashboard/#booth">Enter Four-Seat Booth (Dashboard)</a>
  </div>
</body>
</html>
